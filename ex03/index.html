<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 03 - Colors & Opacity</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Colors & Opacity</h1>

    <div class="palette">

        <div class="swatch named">
            Named Color
        </div>

        <div class="swatch hex">
            HEX Color
        </div>

        <div class="swatch rgb">
            RGB Color
        </div>

        <div class="swatch rgba">
            RGBA Color
        </div>

    </div>

    <h2>Opacity vs RGBA</h2>

    <div class="comparison">

        <div class="box opacity-box">
            <p>opacity: 0.5</p>
            <button>Button</button>
        </div>

        <div class="box rgba-box">
            <p>RGBA background</p>
            <button>Button</button>
        </div>

    </div>

</body>
</html>
