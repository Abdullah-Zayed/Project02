<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 04 - Box Model</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>CSS Box Model</h1>

    <h2>content-box</h2>

    <div class="content-box">
        <p>Width: 300px</p>
        <p>Padding: 30px</p>
        <p>Border: 10px</p>
        <p>Total width: 380px</p>
    </div>


    <h2>border-box</h2>

    <div class="border-box">
        <p>Width: 300px</p>
        <p>Padding: 30px</p>
        <p>Border: 10px</p>
        <p>Total width: 300px</p>
    </div>

</body>
</html>
